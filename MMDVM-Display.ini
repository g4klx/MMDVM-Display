[General]
# Valid values are Dummy, HD44780, LCDproc, Nextion, OLED, TFTSurenoo
Display=Dummy
TemperatureInF=0
# The clock's date and time, as strftime() formats, e.g. DateFormat=%d/%m/%y
# or %m/%d/%y, TimeFormat=%H:%M:%S or %I:%M:%S %p. Unset, the locale's
# formats (%x and %X) are used.
# DateFormat=%d/%m/%y
# TimeFormat=%H:%M:%S
Daemon=0

[Log]
# Logging levels, 0=No logging
MQTTLevel=1
DisplayLevel=1

[MQTT]
Host=127.0.0.1
Port=1883
Keepalive=60
Auth=0
Username=mmdvm
Password=mmdvm
Name=display
HostMQTTName=host
InfoMQTTName=info
HostConfName=MMDVM-Host

[TFT Surenoo]
# Port=modem
Port=/dev/ttyAMA0
Brightness=50
ScreenLayout=0

[HD44780]
Rows=2
Columns=16

# For basic HD44780 displays (4-bit connection)
# rs, strb, d0, d1, d2, d3
Pins=11,10,0,1,2,3

# Device address for I2C
I2CAddress=0x20

# PWM backlight
PWM=0
PWMPin=21
PWMBright=100
PWMDim=16

DisplayClock=1
UTC=0

[Nextion]
# Port=modem
Port=/dev/ttyUSB0
# Speed is only used for physically attached screens
Speed=9600
Brightness=50
DisplayClock=1
UTC=0
# Screen Layout: 0=G4KLX 2=ON7LDS 3=ON7LDS DIY
ScreenLayout=2
IdleBrightness=20
# For ScreenLayout=3 only:
# Talkgroup names: BrandMeister's groups.txt (JSON), or a "91 Worldwide" line
# each; fix the path as required
# GroupsFile=groups.txt
# Callers' details: the same files as MMDVM-Host's [DMR Id Lookup] File
# (DMRIds.dat, or RadioID's user.csv) and [NXDN Id Lookup] File (NXDN.csv);
# fix the paths as required
# DMRIdFile=DMRIds.dat
# NXDNIdFile=NXDN.csv
# Seconds idle before the screen sleeps (0 = never); a call or a touch wakes it
SleepWhenIdle=0

[OLED]
Type=3
Brightness=0
Invert=0
Scroll=1
Rotate=0
Cast=0
LogoScreensaver=1

[LCDproc]
Address=localhost
Port=13666
#LocalPort=13667
DimOnIdle=0
DisplayClock=1
UTC=0
